# Training data: frame index, cameras, crops (Stage 3).
#
# Provenance of each choice:
#   [paper] = RECAP / Mulligan papers
#   [lars]  = explicitly specified by Lars Ankile
#   [ours]  = our experimental choice (documented, can be changed)

dataset_config: configs/dataset.yaml

# [lars] the two policy cameras: left wrist view and the side-on view (Q2).
cameras: [wrist_left, side_1]

# [paper] 224x224 per camera after a fixed per-camera crop (Mulligan Table 16/21).
image_size: 224

# [ours] fixed square crop boxes (x0, y0, x1, y1) in the 640x480 source frame, chosen from
# mid-episode frames and the initial-state extremes (reports/data_checks.md). Same box for
# every frame: no random crops, no flips. Resized (bilinear) to image_size x image_size.
#   wrist_left: full height, centred. The 420 px centre crop cut off the holder's top during
#               approach and insertion.
#   side_1:     420 px, shifted to the top and 30 px right. The scene (marker, holder, gripper
#               at insertion) sits in the upper middle; the bottom of the frame is empty table,
#               and the centre crop cut the gripper at the top edge.
crops:
  wrist_left: [80, 0, 560, 480]
  side_1: [140, 0, 560, 420]

# [paper-standard] torchvision ImageNet statistics, matching the pretrained ResNet-18.
imagenet_mean: [0.485, 0.456, 0.406]
imagenet_std: [0.229, 0.224, 0.225]

paths:
  video_root: data/videos
  frame_targets: data/targets/frame_targets.parquet
  frame_index: data/frames/frame_index.parquet
  report: reports/data_checks.md
  figure_dir: reports/figures/stage3
