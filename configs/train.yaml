# Training settings (Stage 3.8+). All [ours, not paper] unless tagged.

data_config: configs/data.yaml
target_config: configs/targets.yaml

seed: 0
batch_size: 32
optimizer: adamw            # torch default betas (0.9, 0.999), eps 1e-8
weight_decay: 0.01          # torch AdamW default
lr_backbone: 1.0e-4         # pretrained ResNet-18: smaller steps
lr_head: 1.0e-3             # randomly initialized MLP head
amp: auto                   # bf16 if the GPU supports it, else fp16 with a GradScaler
workers: 8
log_every: 25

# Check C (tiny-subset overfit): one training episode of each kind, kept short.
check_c:
  episodes_per_kind: 1
  # success/failure/timeout: fully autonomous; assisted: DAgger rollout with a human takeover
  kinds: [success, failure, timeout, assisted]
  max_frames: 300                                # choose episodes with T + 1 <= this
  steps: 1500
  eval_every: 250

# Stage 4 baseline (vl.train_baseline): all training frames, checkpoint chosen on val CE.
baseline:
  steps: 40000              # x batch 32 = 1.28M samples, ~3.4 passes over the 373,947 train frames
  warmup_steps: 500         # linear LR warmup, then constant
  schedule: constant
  eval_every: 2000          # full validation split (64,906 frames)
  eval_batch_size: 128
  workers: 28               # video decoding runs in the workers (Stage 3.3: ~28 samples/s each)

# Decision 2(a): same as `baseline` except a shorter run with cosine LR decay and more
# frequent evals (the constant-LR baseline peaked at step 2k and then overfit).
baseline_cosine:
  steps: 8000               # ~0.68 passes over the train frames
  warmup_steps: 500
  schedule: cosine          # LR factor: linear warmup, then cosine from 1 to 0 at the last step
  eval_every: 500
  eval_batch_size: 128
  workers: 28

baseline_lowlr:             # decision 2(b): baseline_cosine with both learning rates 10x lower
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5       # overrides the top-level lr_backbone / lr_head for this section
  lr_head: 1.0e-4

# Stage 5 stronger backbone, LR arm: baseline_lowlr with the backbone LR 3.3x lower (DINOv2 ViT-S
# peaked at step 1.5k and then overfit under baseline_lowlr). Head LR unchanged. [ours]
baseline_lowlr_bb3e6:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 3.0e-6
  lr_head: 1.0e-4

# Stage 5 stronger backbone, layer-decay arm (DINOv2 only): baseline_lowlr with ViT layer-wise LR
# decay. Top of the backbone (final norm) at lr_backbone 1e-5, x0.75 per layer going down: last
# block 7.5e-6 ... embeddings 1e-5 * 0.75^13 = 2.4e-7 (vl.model.layer_decay_groups). Head LR
# unchanged. [ours; 0.75 is a common value for ViT-S/B fine-tuning]
baseline_lowlr_llrd:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  layer_decay: 0.75

# Stage 5 augmentation arms (reports/stage5_augmentation_plan.md): baseline_lowlr plus a
# training-only `augment` block (see vl.dataset). Validation is never augmented. [ours]
baseline_lowlr_aug_photo:   # A1 photometric, per camera
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {brightness: 0.3, contrast: 0.3, saturation: 0.3, hue: 0.03}

baseline_lowlr_aug_crop:    # A2 geometric: crop box shifted up to +-24 px, scaled 0.9-1.0
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [0.9, 1.0]}

baseline_lowlr_aug_both:    # A3 = A1 + A2
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {brightness: 0.3, contrast: 0.3, saturation: 0.3, hue: 0.03, crop_shift_px: 24, crop_scale: [0.9, 1.0]}

# Stage 5 crop sweep (2026-10-21). Step 1 (length): A2 crop unchanged at 16k steps; at 8k its val CE
# was still falling when the cosine LR reached 0. Step 2 (strength, seed 0 screen): crop_pad lets the
# box leave the frame (ImageNet-mean fill), so shifts and zoom-out are no longer clamped; p24 is A2
# with padding, the reference that separates "pad" from "stronger". All: baseline_lowlr + 16k steps,
# eval every 1000 (every 500 would add ~15 min per run). [ours]
baseline_lowlr_crop16k:
  steps: 16000
  warmup_steps: 500
  schedule: cosine
  eval_every: 1000
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [0.9, 1.0]}

baseline_lowlr_crop16k_p24:
  steps: 16000
  warmup_steps: 500
  schedule: cosine
  eval_every: 1000
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [0.9, 1.0], crop_pad: true}

baseline_lowlr_crop16k_s48:
  steps: 16000
  warmup_steps: 500
  schedule: cosine
  eval_every: 1000
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 48, crop_scale: [0.9, 1.0], crop_pad: true}

baseline_lowlr_crop16k_s72:
  steps: 16000
  warmup_steps: 500
  schedule: cosine
  eval_every: 1000
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 72, crop_scale: [0.9, 1.0], crop_pad: true}

baseline_lowlr_crop16k_z75:
  steps: 16000
  warmup_steps: 500
  schedule: cosine
  eval_every: 1000
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [0.75, 1.0], crop_pad: true}

baseline_lowlr_crop16k_z60:
  steps: 16000
  warmup_steps: 500
  schedule: cosine
  eval_every: 1000
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [0.6, 1.0], crop_pad: true}

baseline_lowlr_crop16k_zout:
  steps: 16000
  warmup_steps: 500
  schedule: cosine
  eval_every: 1000
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [1.0, 1.15], crop_pad: true}

baseline_lowlr_crop16k_strong:
  steps: 16000
  warmup_steps: 500
  schedule: cosine
  eval_every: 1000
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 48, crop_scale: [0.75, 1.0], crop_pad: true}

# Stage 5 crop sweep, 8k re-screen (2026-10-21): the 16k screen ran on the wrong schedule (step 1:
# the 8k cosine anneal is what helps crop), so the same padded arms again on A2's own recipe:
# baseline_lowlr_aug_crop with only `augment` changed. [ours]
baseline_lowlr_crop8k_p24:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [0.9, 1.0], crop_pad: true}

baseline_lowlr_crop8k_s48:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 48, crop_scale: [0.9, 1.0], crop_pad: true}

baseline_lowlr_crop8k_s72:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 72, crop_scale: [0.9, 1.0], crop_pad: true}

baseline_lowlr_crop8k_z75:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [0.75, 1.0], crop_pad: true}

baseline_lowlr_crop8k_z60:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [0.6, 1.0], crop_pad: true}

baseline_lowlr_crop8k_zout:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [1.0, 1.15], crop_pad: true}

baseline_lowlr_crop8k_strong:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 48, crop_scale: [0.75, 1.0], crop_pad: true}

# Stage 5 "full image augmentation" (2026-10-21; standard settings suggested by Lars, LeRobot
# ImageTransforms scheme reimplemented in vl.dataset): per image exactly 3 of the 6 transforms,
# applied in this order, on the 224 px crop. baseline_lowlr + `augment` only; no crop jitter, so
# the affine translate (5% = ~11 px at 224, ~ +-21-24 px in the source) stands in for A2's shift.
baseline_lowlr_aug_full:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment:
    full: {n: 3, brightness: 0.2, contrast: 0.2, saturation: 0.5, hue: 0.05, sharpness: 0.5,
           affine: {degrees: 5.0, translate: 0.05}}

# Stage 5 crop + full augmentation (2026-10-21): baseline_lowlr_aug_crop (A2 crop jitter) + the
# `full` block of baseline_lowlr_aug_full with affine translate 0, so position jitter stays at A2's
# level (stronger shifts all lost in the crop sweep); rotation kept. [ours]
baseline_lowlr_aug_crop_full:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment:
    crop_shift_px: 24
    crop_scale: [0.9, 1.0]
    full: {n: 3, brightness: 0.2, contrast: 0.2, saturation: 0.5, hue: 0.05, sharpness: 0.5,
           affine: {degrees: 5.0, translate: 0.0}}

# Stage 5 per-camera split (2026-10-22): A2 crop jitter on one camera, the full block of
# baseline_lowlr_aug_full (unchanged) on the other. Tests hypothesis (b): crop's success cost comes
# from shifting the fixed side camera, whose absolute pixel position encodes arm pose. [ours]
baseline_lowlr_aug_split_cropwrist:   # crop on wrist_left, full on side_1
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment:
    per_camera:
      wrist_left: {crop_shift_px: 24, crop_scale: [0.9, 1.0]}
      side_1:
        full: {n: 3, brightness: 0.2, contrast: 0.2, saturation: 0.5, hue: 0.05, sharpness: 0.5,
               affine: {degrees: 5.0, translate: 0.05}}

baseline_lowlr_aug_split_cropside:    # crop on side_1, full on wrist_left
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment:
    per_camera:
      side_1: {crop_shift_px: 24, crop_scale: [0.9, 1.0]}
      wrist_left:
        full: {n: 3, brightness: 0.2, contrast: 0.2, saturation: 0.5, hue: 0.05, sharpness: 0.5,
               affine: {degrees: 5.0, translate: 0.05}}

paths:
  runs: data/runs            # checkpoints + logs (gitignored, on Karen's NFS storage)
