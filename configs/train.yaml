# Training settings (Stage 3.8+). All [ours, not paper] unless tagged.

data_config: configs/data.yaml
target_config: configs/targets.yaml

seed: 0
batch_size: 32
optimizer: adamw            # torch default betas (0.9, 0.999), eps 1e-8
weight_decay: 0.01          # torch AdamW default
lr_backbone: 1.0e-4         # pretrained ResNet-18: smaller steps
lr_head: 1.0e-3             # randomly initialized MLP head
amp: auto                   # bf16 if the GPU supports it, else fp16 with a GradScaler
workers: 8
log_every: 25

# Check C (tiny-subset overfit): one training episode of each kind, kept short.
check_c:
  episodes_per_kind: 1
  # success/failure/timeout: fully autonomous; assisted: DAgger rollout with a human takeover
  kinds: [success, failure, timeout, assisted]
  max_frames: 300                                # choose episodes with T + 1 <= this
  steps: 1500
  eval_every: 250

# Stage 4 baseline (vl.train_baseline): all training frames, checkpoint chosen on val CE.
baseline:
  steps: 40000              # x batch 32 = 1.28M samples, ~3.4 passes over the 373,947 train frames
  warmup_steps: 500         # linear LR warmup, then constant
  schedule: constant
  eval_every: 2000          # full validation split (64,906 frames)
  eval_batch_size: 128
  workers: 28               # video decoding runs in the workers (Stage 3.3: ~28 samples/s each)

# Decision 2(a): same as `baseline` except a shorter run with cosine LR decay and more
# frequent evals (the constant-LR baseline peaked at step 2k and then overfit).
baseline_cosine:
  steps: 8000               # ~0.68 passes over the train frames
  warmup_steps: 500
  schedule: cosine          # LR factor: linear warmup, then cosine from 1 to 0 at the last step
  eval_every: 500
  eval_batch_size: 128
  workers: 28

baseline_lowlr:             # decision 2(b): baseline_cosine with both learning rates 10x lower
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5       # overrides the top-level lr_backbone / lr_head for this section
  lr_head: 1.0e-4

# Stage 5 stronger backbone, LR arm: baseline_lowlr with the backbone LR 3.3x lower (DINOv2 ViT-S
# peaked at step 1.5k and then overfit under baseline_lowlr). Head LR unchanged. [ours]
baseline_lowlr_bb3e6:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 3.0e-6
  lr_head: 1.0e-4

# Stage 5 stronger backbone, layer-decay arm (DINOv2 only): baseline_lowlr with ViT layer-wise LR
# decay. Top of the backbone (final norm) at lr_backbone 1e-5, x0.75 per layer going down: last
# block 7.5e-6 ... embeddings 1e-5 * 0.75^13 = 2.4e-7 (vl.model.layer_decay_groups). Head LR
# unchanged. [ours; 0.75 is a common value for ViT-S/B fine-tuning]
baseline_lowlr_llrd:
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  layer_decay: 0.75

# Stage 5 augmentation arms (reports/stage5_augmentation_plan.md): baseline_lowlr plus a
# training-only `augment` block (see vl.dataset). Validation is never augmented. [ours]
baseline_lowlr_aug_photo:   # A1 photometric, per camera
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {brightness: 0.3, contrast: 0.3, saturation: 0.3, hue: 0.03}

baseline_lowlr_aug_crop:    # A2 geometric: crop box shifted up to +-24 px, scaled 0.9-1.0
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {crop_shift_px: 24, crop_scale: [0.9, 1.0]}

baseline_lowlr_aug_both:    # A3 = A1 + A2
  steps: 8000
  warmup_steps: 500
  schedule: cosine
  eval_every: 500
  eval_batch_size: 128
  workers: 28
  lr_backbone: 1.0e-5
  lr_head: 1.0e-4
  augment: {brightness: 0.3, contrast: 0.3, saturation: 0.3, hue: 0.03, crop_shift_px: 24, crop_scale: [0.9, 1.0]}

paths:
  runs: data/runs            # checkpoints + logs (gitignored, on Karen's NFS storage)
